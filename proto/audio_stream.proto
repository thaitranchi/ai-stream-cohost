syntax = "proto3";

package audio_engine;

service AudioProcessor {
  rpc ProcessAudio(stream AudioFrame) returns (stream ProcessedChunk);
  rpc DetectVoiceActivity(AudioFrame) returns (VadResult);
}

message AudioConfig {
  uint32 sample_rate = 1;
  uint32 channels = 2;
  string encoding = 3; // "pcm_f32le", "pcm_i16", etc.
}

message AudioFrame {
  bytes data = 1;
  uint64 timestamp_ms = 2;
  AudioConfig config = 3;
}

message VadResult {
  bool is_speech = 1;
  float speech_probability = 2;
  uint64 start_ms = 3;
  uint64 end_ms = 4;
}

message ProcessedChunk {
  bytes data = 1;
  uint64 timestamp_ms = 2;
  bool is_speech = 3;
  float energy = 4;
}
